services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - prism-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prism-postgres:
